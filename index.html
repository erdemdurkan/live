<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Canlı Yayın Oynatıcı</title>
    <!-- HLS.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #e50914;
            --surface: #0f1419;
            --surface-alt: #1a1f2e;
            --text: #f7fafc;
            --text-muted: #a0aec0;
            --border: #2d3748;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0e14;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .player-wrapper {
            flex: 2;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            aspect-ratio: 16/9;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .channel-list {
            flex: 1;
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            min-width: 280px;
        }

        .channel-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }

        .channel-item {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-item:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .channel-item.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .badge {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        @media (max-width: 800px) {
            .container { flex-direction: column; }
            .player-wrapper, .channel-list { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HTML5 Video Oynatıcı -->
        <div class="player-wrapper">
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>

        <!-- Kanal Listesi -->
        <div class="channel-list">
            <div class="channel-title">Canlı Kanallar</div>

            <div class="channel-item" onclick="playStream('https://andro.evrenesoglu99.click/checklist/batutest.m3u8', this)">
                <span>BeIN Sports 1</span>
                <span class="badge">NON</span>
            </div>
			
            <div class="channel-item" onclick="playStream('https://tv-trt1.medya.trt.com.tr/master.m3u8', this)">
                <span>TRT 1 HD</span>
                <span class="badge">YEREL</span>
            </div>

	    <div class="channel-item" onclick="playStream('https://andro.evrenesoglu99.click/checklist/androstreamlivetrt1.m3u8', this)">
                <span>TRT 1 HD</span>
                <span class="badge">NON</span>
            </div>

<div class="channel-item" onclick="playStream('https://trkvz.daioncdn.net/atv/atv_1080p.m3u8?e=1789185715&st=1_WInKhxosQm74LvFIA0gw&sid=8qrdxgdhhfsi&app=d1ce2d40-5256-4550-b02e-e73c185a314e&ce=3', this)">
                <span>ATV HD</span>
                <span class="badge">YEREL</span>
            </div>
			
            <div class="channel-item" onclick="playStream('https://andro.evrenesoglu99.click/checklist/androstreamliveatv.m3u8', this)">
                <span>ATV HD</span>
                <span class="badge">NON</span>
            </div>
			
			<div class="channel-item" onclick="playStream('https://ciner.daioncdn.net/showtv/showtv_1080p.m3u8', this)">
                <span>SHOW TV HD</span>
                <span class="badge">YEREL</span>
            </div>
			
			<div class="channel-item" onclick="playStream('https://dogus.daioncdn.net/startv/startv_720p.m3u8', this)">
                <span>STAR TV HD</span>
                <span class="badge">YEREL</span>
            </div>
						
            <div class="channel-item" onclick="playStream('https://tv-trthaber.medya.trt.com.tr/master.m3u8', this)">
                <span>TRT Haber HD</span>
                <span class="badge">YEREL</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        let hlsInstance = null;

        function playStream(url, element) {
            // Aktif buton görselini güncelle
            if (element) {
                document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }

            // HLS.js motoru kontrolü
            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy(); // Önceki akışı temizle
                }
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari / iOS yerel desteği
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(() => {});
                });
            }
        }

        // Sayfa açıldığında varsayılan olarak TRT 1'i başlat
        window.addEventListener('DOMContentLoaded', () => {
            playStream('https://tv-trt1.medya.trt.com.tr/master.m3u8', null);
        });
    </script>
</body>
</html>
